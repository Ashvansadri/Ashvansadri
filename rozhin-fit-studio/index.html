function setTab(t){S.tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));document.querySelectorAll('[data-pane]').forEach(p=>p.classList.toggle('hidden',p.dataset.pane!==t));}

$('#app').innerHTML=`
<header><div><a class="wordmark" href="${SHOP}">ROZHIN MAISON</a><div class="tag">THE BESPOKE STUDIO</div></div><nav class="headlinks"><a href="${SHOP}">فروشگاه مزون ↗</a><a href="${CLIENT}">پیگیری سفارش ↗</a></nav></header>
<div style="text-align:center;padding:14px 18px;background:#211a15;color:#f4d6ae;border-bottom:1px solid #765734;line-height:2;font-size:13px">نسخه آزمایشی مستقل روژین — تصویر لباس به صورت دستی ترکیب می‌شود. برای <a href="https://huggingface.co/spaces/fashn-ai/fashn-vton-1.5" target="_blank" rel="noopener noreferrer" style="text-decoration:underline;color:#ffdfa8;font-weight:700">پرو واقعی رایگان FASHN</a> و برای <a href="https://huggingface.co/spaces/Qwen/Qwen-Image-Edit-2509" target="_blank" rel="noopener noreferrer" style="text-decoration:underline;color:#ffdfa8;font-weight:700">تبدیل ایده و اسکیس به تصویر با Qwen</a> کلیک کنید؛ عکس آپلودشده در این ابزارهای خارجی به سرور آنها ارسال می‌شود.</div><section class="hero"><div class="eyebrow">AI-FASHION EXPERIENCE · MAISON ROZHIN</div><h1>اتاق پرو و طراحی اختصاصی روژین</h1><p>لباس دلخواه را از کالکشن انتخاب کنید یا تصویر طرح شخصی‌تان را بیاورید؛ روی عکس خودتان پیش‌نمایش بسازید و برای آماده‌سازی الگو، اندازه‌های لازم را ثبت کنید.</p></section>
<main class="layout"><nav class="nav" aria-label="مراحل طراحی"><button class="tab active" data-tab="gallery">۰۱ · کالکشن مزون</button><button class="tab" data-tab="custom">۰۲ · طرح خودم</button><button class="tab" data-tab="pattern">۰۳ · اندازه‌ها و الگو</button><span class="smallnote">عکس شخصی در این پیش‌نمایش روی دستگاه خودتان باقی می‌ماند.</span></nav>
<section data-pane="gallery"><div class="sectionTitle"><h2>کالکشن زنده مزون</h2><span class="badge" id="count">در حال بارگذاری</span></div><div id="catalog" class="collection"><div class="notice">دموی آفلاین: گالری زنده فقط روی نسخه منتشرشده فعال خواهد بود.</div></div><div class="grid"><div class="panel"><div class="sectionTitle"><h2>پیش‌نمایش روی عکس شما</h2><span class="badge">ترکیب تصویری آزمایشی</span></div><div class="stage" id="stage"><div class="noPhoto">✧<h3>تصویر تمام‌قد خودتان را انتخاب کنید</h3><p class="muted">نور مناسب، ایستادن روبه‌دوربین و نمایش کامل اندام نتیجه را بهتر می‌کند.</p></div><span class="stamp">LOCAL PREVIEW · بدون ارسال عکس به سرور</span></div><div id="aiResult" class="hidden" style="margin-top:16px"></div></div>
<div class="panel"><h3>تنظیم پیش‌نمایش</h3><div class="controls"><div class="field full"><label>۱ · عکس تمام‌قد شما</label><input id="person" type="file" accept="image/jpeg,image/png,image/webp"><small>فقط JPEG / PNG / WEBP، تا ۸ مگابایت.</small></div><div class="field full"><label>۲ · لباس انتخاب‌شده</label><div id="selectedLabel" class="notice">یکی از مدل‌های کالکشن را انتخاب کنید.</div></div><div class="field"><label>عرض لباس</label><input type="range" id="size" min="12" max="100" value="49"></div><div class="field"><label>جای عمودی</label><input type="range" id="top" min="3" max="79" value="29"></div><div class="field"><label>جابجایی افقی</label><input type="range" id="left" min="15" max="85" value="50"></div><div class="field"><label>شفافیت</label><input type="range" id="alpha" min="20" max="100" value="86"></div><div class="field full"><label><input id="consent" type="checkbox" /> با پردازش عکس توسط سرویس هوش مصنوعی، فقط در صورت فعال‌بودن آن، موافقم.</label></div></div><div class="buttons"><button class="btn" id="render">نمایش روی عکس من</button><button class="btn secondary" id="save">ذخیره پیش‌نمایش PNG</button><button class="btn secondary" id="realAI">آزمایش پرو واقعی رایگان ↗</button></div><p class="disclaimer"><b>تفاوت دو روش:</b> ترکیب دستی تصویر، تناسب واقعی لباس یا تغییر شکل پارچه روی اندام را محاسبه نمی‌کند. پرو واقعی نیازمند سرویس پردازش تصویر و رضایت آگاهانه شماست. نتیجه آن نیز جای پرو حضوری را نمی‌گیرد.</p></div></div></section>
<section data-pane="custom" class="hidden"><div class="sectionTitle"><h2>لباسی که خودتان در ذهن دارید</h2><span class="badge">CUSTOM DESIGN</span></div><div class="grid"><div class="panel"><h3>تصویر لباس یا طرح را بارگذاری کنید</h3><p class="muted">می‌توانید عکس لباسی که در جایی دیده‌اید، عکس لباس فعلی یا طراحی روی کاغذ را انتخاب کنید. تصویر طرح اولیه الزاماً عکس قابل‌پرو از یک لباس واقعی نیست.</p><div class="controls"><div class="field full"><label>تصویر مرجع لباس</label><input id="customFile" type="file" accept="image/jpeg,image/png,image/webp" /></div><div class="field full"><label>نوع مرجع</label><select id="referenceType"><option value="garment">عکس یک لباس واقعی</option><option value="sketch">اسکیس یا نقاشی / طرح ذهنی</option></select></div><div class="field full"><label>توضیح مدل دلخواه، پارچه، رنگ و تغییرات</label><textarea id="customNotes" rows="5" placeholder="مثلاً پیراهن بلند، یقه هفت، آستین پفی، پارچه کرپ به رنگ زرشکی"></textarea></div></div><div class="buttons"><button class="btn" id="useCustom">قرار دادن این لباس در پرو مجازی</button><button class="btn secondary" id="toMeasurements">رفتن به پرسش‌های اندازه‌گیری ←</button></div><div class="disclaimer">از یک اسکیس نمی‌توان بدون مدل مولدِ متصل، عکس نهایی لباس را تولید کرد. برای پارچه، برش پشت، آستر، آزادی و تزئینات باید جزئیات طراحی توسط مزون تأیید شود.</div></div><div class="panel"><h3>تصویر مرجع</h3><div class="stage" id="customStage"><div class="noPhoto">✦<h3>مدل دلخواه خودتان</h3><p>تصویر شما فقط در مرورگر نمایش داده می‌شود.</p></div></div></div></div></section>
<section data-pane="pattern" class="hidden"><div class="sectionTitle"><h2>اندازه‌گیری و نقشه دوخت</h2><span class="badge">BESPOKE MEASUREMENTS</span></div><div class="panel"><div class="notice">الگوسازی دقیق از روی یک عکس، بدون اندازه‌گیری حقیقی و تأیید خیاط ممکن نیست. این بخش مقادیر ضروری را ثبت می‌کند و فقط برای <b>دامن راسته پایه</b> یک الگوی اولیه قابل‌بررسی تولید می‌کند.</div><form id="patternForm"><div class="questions"><div class="field"><label>نوع لباس</label><select name="type" id="garmentType"><option value="skirt">دامن راسته پایه</option><option value="dress">پیراهن / مانتو</option><option value="top">کت / بلوز</option><option value="trousers">شلوار</option></select></div><div class="field"><label>دور کمر (سانتی‌متر) *</label><input type="number" name="waist" min="45" max="180" step="0.5" required placeholder="مثلاً ۷۴"></div><div class="field"><label>دور باسن (سانتی‌متر) *</label><input type="number" name="hip" min="60" max="220" step="0.5" required placeholder="مثلاً ۱۰۰"></div><div class="field"><label>قد نهایی لباس (سانتی‌متر) *</label><input type="number" name="length" min="25" max="180" step="0.5" required placeholder="مثلاً ۷۰"></div><div class="field"><label>فاصله کمر تا برجستگی باسن (سانتی‌متر) *</label><input type="number" name="hipDepth" min="12" max="35" step="0.5" required value="20"></div><div class="field"><label>دور سینه (سانتی‌متر)</label><input type="number" name="bust" min="55" max="190" step="0.5"></div><div class="field"><label>قد کامل فرد (سانتی‌متر)</label><input type="number" name="height" min="125" max="215" step="0.5"></div><div class="field"><label>عرض سرشانه (سانتی‌متر)</label><input type="number" name="shoulders" min="25" max="65" step="0.5"></div><div class="field"><label>قد آستین (سانتی‌متر)</label><input type="number" name="sleeve" min="20" max="85" step="0.5"></div><div class="field"><label>نوع پارچه</label><select name="fabric"><option value="woven">بدون کش / بافت معمولی</option><option value="stretch">کشی</option><option value="unknown">هنوز مشخص نیست</option></select></div><div class="field"><label>آزادی دلخواه</label><select name="fit"><option value="regular">معمولی</option><option value="fitted">جذب</option><option value="relaxed">آزاد</option></select></div><div class="field"><label>مدل دلخواه</label><input type="text" name="title" maxlength="100" placeholder="نام یا ویژگی‌های مدل"></div></div><div class="buttons"><button type="submit" class="btn">بررسی اندازه‌ها و تهیه الگوی اولیه</button><button type="button" class="btn secondary" id="downloadBrief">دریافت برگه مشخصات طراحی</button></div></form><div id="patternResult" class="result hidden"></div></div></section>

// Public live catalog; no demo clothes are fabricated and no personal photo is uploaded.
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
async function loadCatalog(){
 try{
  const {data,error}=await db.rpc('public_shop_catalog',{});
  if(error)throw error;
  S.catalog=(Array.isArray(data)?data:typeof data==='string'?JSON.parse(data):[]).filter(x=>x&&x.id);
  $('#count').textContent=new Intl.NumberFormat('fa-IR').format(S.catalog.length)+' مدل فعال';
  if(!S.catalog.length){$('#catalog').innerHTML='<div class="notice">در نسخه آزمایشی، گالری زنده هنوز فعال نیست. برای آزمودن بارگذاری لباس شخصی، بخش «طرح خودم» را باز کنید.</div>';return;}
  $('#catalog').innerHTML=S.catalog.map((p,i)=>{
    const img=safeSrc(p.front_image||p.back_image);
    return '<button class="product" data-product="'+i+'">'+(img?'<img loading="lazy" src="'+escapeHTML(img)+'" alt="'+escapeHTML(p.name)+'">':'<div class="placeholder">✦</div>')+'<div class="info"><strong>'+escapeHTML(p.name)+'</strong><small>'+escapeHTML(p.category||'مزون روژین')+'</small><small>'+money(p.price)+'</small></div></button>';
  }).join('');
  document.querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>pickProduct(S.catalog[Number(b.dataset.product)],b));
 }catch(err){console.error('Catalog unavailable:',err);$('#count').textContent='اتصال ناموفق';$('#catalog').innerHTML='<div class="notice">فعلاً بارگذاری گالری امکان‌پذیر نیست. <a href="'+SHOP+'"><u>مشاهده مستقیم کالکشن فروشگاه</u></a></div>';}
}
function pickProduct(p,btn){S.selected=p;S.customImage=false;S.garmentData=safeSrc(p.front_image||p.back_image);S.result=null;
 document.querySelectorAll('.product').forEach(x=>x.classList.toggle('sel',x===btn));
 $('#selectedLabel').textContent=p.name+' · '+money(p.price);
 if(!S.garmentData)showToast('این محصول عکس قابل نمایش ندارد؛ عکس لباس دیگری انتخاب کنید.');
 updateStage();}
async function readImage(f){if(!f)return null;if(!['image/jpeg','image/png','image/webp'].includes(f.type))throw new Error('فقط تصویر JPG / PNG / WEBP پذیرفته می‌شود.');if(f.size>8*1024*1024)throw new Error('حجم عکس باید کمتر از ۸ مگابایت باشد.');return new Promise((ok,fail)=>{const r=new FileReader();r.onerror=()=>fail(new Error('خواندن تصویر ناموفق بود.'));r.onload=()=>ok(String(r.result));r.readAsDataURL(f);});}
$('#person').onchange=async e=>{try{S.modelData=await readImage(e.target.files[0]);S.result=null;updateStage()}catch(x){showToast(x.message)}};
$('#customFile').onchange=async e=>{try{const img=await readImage(e.target.files[0]);S.customImage=!!img;S.garmentData=img;S.selected=null;S.result=null;$('#customStage').innerHTML=img?'<img style="max-width:100%;max-height:580px;object-fit:contain" src="'+img+'" alt="مرجع لباس">':'';showToast('تصویر مرجع با موفقیت روی دستگاه بارگذاری شد.');}catch(x){showToast(x.message)}};
function updateStage(){const st=$('#stage');if(!S.modelData){st.innerHTML='<div class="noPhoto">✧<h3>عکس تمام‌قد خودتان را بارگذاری کنید</h3><p>عکس و تصویر لباس تنها روی دستگاه شما پیش‌نمایش می‌شوند.</p></div><span class="stamp">LOCAL PREVIEW</span>';return;}
 st.innerHTML='<img class="person" src="'+S.modelData+'" alt="عکس مشتری">'+(S.garmentData?'<img class="garment" id="garmentOverlay" src="'+S.garmentData+'" alt="تصویر لباس">':'')+'<span class="stamp">PREVIEW · نه پرو فوتورئال</span>';
 const g=$('#garmentOverlay');if(g){g.style.width=$('#size').value+'%';g.style.top=$('#top').value+'%';g.style.left=$('#left').value+'%';g.style.opacity=String(Number($('#alpha').value)/100);}
}
['size','top','left','alpha'].forEach(x=>$('#'+x).oninput=updateStage);
$('#render').onclick=()=>{if(!S.modelData){showToast('ابتدا عکس شخصی را بارگذاری کنید.');return;}if(!S.garmentData){showToast('ابتدا لباس را انتخاب کنید.');return;}updateStage();showToast('پیش‌نمایش ترکیبی آماده است.');};
$('#useCustom').onclick=()=>{if(!S.customImage){showToast('ابتدا عکس لباس یا طرحتان را بارگذاری کنید.');return;}if($('#referenceType').value==='sketch'){showToast('برای تبدیل اسکیس به عکس لباس، ابتدا موتور مولد تصویر باید متصل شود؛ اکنون فقط تصویر خود طرح نمایش داده می‌شود.');}$('#selectedLabel').textContent='طرح اختصاصی شما · '+($('#customNotes').value||'بدون توضیحات');setTab('gallery');updateStage();};
$('#toMeasurements').onclick=()=>setTab('pattern');
function getImage(u){return new Promise((resolve,reject)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>resolve(i);i.onerror=()=>reject(new Error('دریافت تصویر لباس برای ذخیره ترکیبی مجاز نیست. لطفاً از تصویر PNG بارگذاری‌شده استفاده کنید.'));i.src=u;});}
$('#save').onclick=async()=>{if(!S.modelData||!S.garmentData){showToast('ابتدا عکس خود و لباس را انتخاب کنید.');return;}
 try{const [model,garment]=await Promise.all([getImage(S.modelData),getImage(S.garmentData)]);
 const c=document.createElement('canvas');c.width=900;c.height=1200;const ctx=c.getContext('2d');ctx.fillStyle='#201b18';ctx.fillRect(0,0,c.width,c.height);
 // The on-screen stage uses object-fit: contain, so preserve the whole photo.
 const sc=Math.min(c.width/model.width,c.height/model.height),w=model.width*sc,h=model.height*sc;ctx.drawImage(model,(c.width-w)/2,(c.height-h)/2,w,h);
 const gW=c.width*Number($('#size').value)/100,gH=gW*garment.height/garment.width;const gx=c.width*Number($('#left').value)/100-gW/2;const gy=c.height*Number($('#top').value)/100;ctx.globalAlpha=Number($('#alpha').value)/100;ctx.drawImage(garment,gx,gy,gW,gH);ctx.globalAlpha=1;
 const a=document.createElement('a');a.download='rozhin-preview.png';a.href=c.toDataURL('image/png');a.click();
 }catch(err){showToast(err.message);}
};
$('#realAI').onclick=()=>{if(!$('#consent').checked){showToast('برای پردازش هوش مصنوعی ابتدا رضایت پردازش عکس را انتخاب کنید.');return;}window.open('https://huggingface.co/spaces/fashn-ai/fashn-vton-1.5','_blank','noopener,noreferrer');showToast('دموی رایگان در پنجره جداگانه باز شد؛ تصاویر شما به سرویس خارجی ارسال می‌شود.');};

// Draft output: straight-skirt half front/back only. NOT a ready-to-cut industrial pattern.
let currentMeasures=null;
function measureForm(){const f=new FormData($('#patternForm'));const v={type:f.get('type'),title:f.get('title')||'',fabric:f.get('fabric'),fit:f.get('fit')};for(const k of ['waist','hip','length','hipDepth','bust','height','shoulders','sleeve']){const x=f.get(k);v[k]=x?Number(x):null;}return v;}
function validateMeasurements(m){if(!m.waist||!m.hip||!m.length||!m.hipDepth)throw new Error('چهار اندازه ضروری را وارد کنید.');if(m.hip<m.waist)throw new Error('دور باسن از دور کمر کوچک‌تر است؛ اندازه‌ها را بازبینی کنید.');if(m.hipDepth>=m.length)throw new Error('فاصله کمر تا باسن باید کمتر از قد لباس باشد.');if(m.type==='skirt' && m.fabric==='stretch')throw new Error('برای پارچه کشی باید الگو با درصد کشسانی اختصاصی طراحی شود؛ فعلاً پارچه بدون کش انتخاب کنید.');}
function draftSVG(m){
 const ease=m.fit==='fitted'?2:m.fit==='relaxed'?8:4;const wQuarter=(m.hip+ease)/4;const waistQuarter=(m.waist+2)/4;
 const intake=wQuarter-waistQuarter, side=Math.min(3.5,Math.max(0,intake*0.5)),dart=Math.max(0,intake-side);
 const panelWidth=wQuarter*10;const sideMM=side*10;const topWidth=panelWidth-sideMM;
 const hemW=panelWidth-(m.fit==='fitted'?5:0);const len=m.length*10;const hipY=m.hipDepth*10;
 const sep=85,ox=30,oy=80,W=Math.ceil(panelWidth*2+sep+ox*2),H=Math.ceil(len+oy+175);
 const panel=(x,label,back)=>{const sy=back?oy+15:oy;const dartX=x+topWidth*(back?.52:.60),dartHalf=(dart*10)/2,dartDepth=back?125:90;
 const p=`M ${x} ${sy} L ${x+topWidth} ${sy} Q ${x+panelWidth} ${sy+hipY*.48} ${x+panelWidth} ${sy+hipY} L ${x+hemW} ${sy+len} L ${x} ${sy+len} Z`;
 return `<path d="${p}" fill="none" stroke="#201c19" stroke-width="1.2" />`+
 (dartHalf>1?`<path d="M ${dartX-dartHalf} ${sy} L ${dartX} ${sy+dartDepth} L ${dartX+dartHalf} ${sy}" fill="none" stroke="#9f6658" stroke-width=".8" />`:'')+
 `<path d="M ${x} ${sy+hipY} H ${x+panelWidth}" fill="none" stroke="#999" stroke-width=".5" stroke-dasharray="4,4"/>`+
 `<text x="${x+4}" y="${sy+hipY+24}" fill="#222" font-size="12">${label} | FOLD</text>`+
 `<text x="${x+4}" y="${sy+len-15}" fill="#555" font-size="10">HEM</text>`;
 };
 const front=panel(ox,'FRONT',false),back=panel(ox+panelWidth+sep,'BACK',true);
 return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}mm" height="${H}mm" viewBox="0 0 ${W} ${H}" role="img" aria-label="Provisional straight skirt draft">
 <rect width="100%" height="100%" fill="white" />
 <style>text{font-family:Arial,sans-serif}</style>
 <text x="18" y="24" fill="#1c1c1c" font-size="15" font-weight="bold">ROZHIN MAISON · BASIC STRAIGHT SKIRT · PRELIMINARY DRAFT</text>
 <text x="18" y="45" fill="#444" font-size="11">ALL DIMENSIONS IN MILLIMETERS · NO SEAM/HEM ALLOWANCES INCLUDED</text>
 <rect x="${W-122}" y="${H-117}" width="100" height="100" fill="none" stroke="#151515" stroke-width="1"/>
 <text x="${W-120}" y="${H-124}" fill="#111" font-size="10">PRINT CALIBRATION 100 mm</text>
 ${front}${back}
 <text x="${ox}" y="${H-22}" fill="#ab1c20" font-size="11">DRAFT ONLY · VERIFY DARTS, EASE, FABRIC, SEAM ALLOWANCES AND FIT ON TOILE BEFORE CUTTING</text>
 </svg>`;
}
function download(content,name,mime){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);}
$('#patternForm').onsubmit=e=>{e.preventDefault();try{const m=measureForm();validateMeasurements(m);currentMeasures=m;
 let info='<b>برگه اندازه‌گیری اولیه:</b> کمر '+m.waist+'، باسن '+m.hip+'، قد لباس '+m.length+'، فاصله کمر تا باسن '+m.hipDepth+' سانتی‌متر.';
 if(m.type==='skirt'){const svg=draftSVG(m);info+='<p>پیش‌نویس هندسی دامن راسته آماده است. این خروجی آزمایشی، بدون جای دوخت، اصلاح فرم اندام، موازنه جلو/پشت و کنترل فیت است.</p><button id="downloadSVG" class="btn">دریافت SVG اندازه واقعی اولیه</button><div style="margin-top:15px;overflow:auto;background:white;border-radius:12px;max-height:500px">'+svg+'</div>';}
 else{info+='<p>برای این مدل، محاسبات قابل‌اعتماد الگو از اندازه‌های بیشتر، دیتیل پشت و جلو، نوع یقه و آستین و بازبینی الگوساز نیاز دارد. فعلاً فقط برگه مشخصات ساخته می‌شود.</p>';}
 $('#patternResult').innerHTML=info;$('#patternResult').classList.remove('hidden');if(m.type==='skirt')$('#downloadSVG').onclick=()=>download(draftSVG(m),'rozhin-initial-skirt-pattern.svg','image/svg+xml;charset=utf-8');
 }catch(err){showToast(err.message)}};
$('#downloadBrief').onclick=()=>{let m=measureForm();try{validateMeasurements(m)}catch(e){showToast(e.message);return}const brief={brand:'ROZHIN MAISON / DOKMEH',classification:'CUSTOMER PROVIDED MEASUREMENTS - UNVERIFIED',createdAt:new Date().toISOString(),measurements_cm:m,design_description:$('#customNotes').value||'',reference_type:$('#referenceType').value,source_product_id:S.selected?.id||null,review_status:'requires-professional-tailor-verification',notes:'Not a production-ready pattern. Customer reference photos are not included.'};download(JSON.stringify(brief,null,2),'rozhin-design-brief.json','application/json');showToast('برگه مشخصات اولیه آماده شد.');};
loadCatalog();
</script></body></html>
