const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

const toEnDigits=s=>String(s??'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const toFaDigits=s=>String(s??'').replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[Number(d)]);
const jDiv=(a,b)=>~~(a/b),jMod=(a,b)=>a-~~(a/b)*b;
function jalCal(jy){const breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];let bl=breaks.length,gy=jy+621,leapJ=-14,jp=breaks[0],jm,jump=0,leap,leapG,march,n;if(jy<jp||jy>=breaks[bl-1])throw new Error('سال شمسی نامعتبر است');for(let i=1;i<bl;i++){jm=breaks[i];jump=jm-jp;if(jy<jm)break;leapJ+=jDiv(jump,33)*8+jDiv(jMod(jump,33),4);jp=jm}n=jy-jp;leapJ+=jDiv(n,33)*8+jDiv(jMod(n,33)+3,4);if(jMod(jump,33)===4&&jump-n===4)leapJ++;leapG=jDiv(gy,4)-jDiv((jDiv(gy,100)+1)*3,4)-150;march=20+leapJ-leapG;if(jump-n<6)n=n-jump+jDiv(jump+4,33)*33;leap=jMod(jMod(n+1,33)-1,4);if(leap===-1)leap=4;return{leap,gy,march}}
function g2d(gy,gm,gd){let d=jDiv((gy+jDiv(gm-8,6)+100100)*1461,4)+jDiv(153*jMod(gm+9,12)+2,5)+gd-34840408;d=d-jDiv(jDiv(gy+100100+jDiv(gm-8,6),100)*3,4)+752;return d}
function d2g(jdn){let j=4*jdn+139361631;j=j+jDiv(jDiv(4*jdn+183187720,146097)*3,4)*4-3908;let i=jDiv(jMod(j,1461),4)*5+308,gd=jDiv(jMod(i,153),5)+1,gm=jMod(jDiv(i,153),12)+1,gy=jDiv(j,1461)-100100+jDiv(8-gm,6);return{gy,gm,gd}}
function j2d(jy,jm,jd){const r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-jDiv(jm,7)*(jm-7)+jd-1}
function d2j(jdn){const g=d2g(jdn);let jy=g.gy-621,r=jalCal(jy),jdn1f=g2d(g.gy,3,r.march),jd,jm,k=jdn-jdn1f;if(k>=0){if(k<=185){jm=1+jDiv(k,31);jd=jMod(k,31)+1;return{jy,jm,jd}}k-=186}else{jy--;k+=179;if(r.leap===1)k++}jm=7+jDiv(k,30);jd=jMod(k,30)+1;return{jy,jm,jd}}
function gregToJalali(v){if(!v)return null;const [gy,gm,gd]=String(v).slice(0,10).split('-').map(Number);return d2j(g2d(gy,gm,gd))}
function jalaliToGreg(jy,jm,jd){const g=d2g(j2d(Number(jy),Number(jm),Number(jd)));return String(g.gy).padStart(4,'0')+'-'+String(g.gm).padStart(2,'0')+'-'+String(g.gd).padStart(2,'0')}
function jMonthDays(y,m){if(m<=6)return 31;if(m<=11)return 30;return jalCal(Number(y)).leap===0?30:29}
function jalaliPicker(name,id,initial='',mode='future'){return `<div class="jalaliPick" id="${id}" data-initial="${esc(initial)}" data-mode="${mode}"><select data-j="d" aria-label="روز"></select><select data-j="m" aria-label="ماه"></select><select data-j="y" aria-label="سال"></select><input type="hidden" name="${name}" id="${id}_value" value="${esc(initial)}"></div><small class="jalaliHint" id="${id}_hint"></small>`}
function bindJalaliPicker(id,onChange){const box=document.getElementById(id);if(!box)return;const ys=box.querySelector('[data-j="y"]'),ms=box.querySelector('[data-j="m"]'),ds=box.querySelector('[data-j="d"]'),hidden=document.getElementById(id+'_value'),hint=document.getElementById(id+'_hint'),mode=box.dataset.mode||'future';const todayIso=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Tehran'}),todayJ=gregToJalali(todayIso);let init=box.dataset.initial?gregToJalali(box.dataset.initial):null;const from=mode==='past'?todayJ.jy-90:todayJ.jy,to=mode==='past'?todayJ.jy:todayJ.jy+3;ys.innerHTML='';for(let y=to;y>=from;y--){ys.insertAdjacentHTML('beforeend',`<option value="${y}">${toFaDigits(y)}</option>`)}ms.innerHTML=jMonths.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');function fillDays(){const y=Number(ys.value),m=Number(ms.value),old=Number(ds.value)||1,max=jMonthDays(y,m);ds.innerHTML='';for(let d=1;d<=max;d++)ds.insertAdjacentHTML('beforeend',`<option value="${d}">${toFaDigits(d)}</option>`);ds.value=String(Math.min(old,max))}function sync(trigger=true){fillDays();const g=jalaliToGreg(ys.value,ms.value,ds.value);hidden.value=g;hint.textContent='تاریخ انتخاب‌شده: '+faDate(g);if(mode==='future'&&g<todayIso){hidden.value='';hint.textContent='تاریخ گذشته قابل انتخاب نیست.'}if(trigger&&onChange)onChange()}const base=init||(mode==='past'?{jy:todayJ.jy-25,jm:todayJ.jm,jd:todayJ.jd}:todayJ);ys.value=String(base.jy);ms.value=String(base.jm);fillDays();ds.value=String(base.jd);sync(false);[ys,ms,ds].forEach(x=>x.onchange=()=>sync(true))}
function waNumber(phone){let p=String(phone||'').replace(/\D/g,'');if(p.startsWith('0098'))p=p.slice(2);if(p.startsWith('0'))p='98'+p.slice(1);if(!p.startsWith('98')&&p.length===10)p='98'+p;return p}
function openWhatsApp(phone,text){const p=waNumber(phone);if(!p)return toast('شماره واتساپ مشتری ثبت نشده');window.open('https://wa.me/'+p+'?text='+encodeURIComponent(text),'_blank','noopener')}
function downloadBackup(){const blob=new Blob([JSON.stringify({exported_at:new Date().toISOString(),studio:state.data.studio,services:state.data.services,clients:state.data.clients,appointments:state.data.appointments,transactions:state.data.transactions,portfolio:state.data.portfolio,blocks:state.data.blocks},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='NailDesk-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

function urlBase64ToUint8Array(base64String){const padding='='.repeat((4-base64String.length%4)%4);const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(base64);return Uint8Array.from([...raw].map(ch=>ch.charCodeAt(0)))}
async function ensurePushSubscription(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))return null;
  const perm=await Notification.requestPermission();if(perm!=='granted')return null;
  const reg=await navigator.serviceWorker.register('/sw.js');await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub){const cfg=await api('push-config');sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(cfg.publicKey)})}
  return sub.toJSON();
}
async function enableAdminPush(){try{const sub=await ensurePushSubscription();if(!sub)return toast('اجازه اعلان داده نشد');await api('push-subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription:sub})});toast('اعلان‌های مدیریت فعال شد ✅')}catch(e){toast('فعال‌سازی اعلان ناموفق بود: '+e.message)}}
async function api(name,opt={}){const h=new Headers(opt.headers||{});if(token())h.set('Authorization','Bearer '+token());let lastErr;for(let i=0;i<3;i++){try{const r=await fetch(API+'?api='+name,{...opt,headers:h,cache:'no-store'});let j={};try{j=await r.json()}catch{}if(!r.ok){if(r.status>=500&&i<2){await new Promise(x=>setTimeout(x,600*(i+1)));continue}throw new Error(j.error||'خطا')}if(name==='public-config'&&(!opt.method||opt.method==='GET')){try{localStorage.setItem('nd_public_cache',JSON.stringify(j))}catch{}}return j}catch(e){lastErr=e;if(i<2)await new Promise(x=>setTimeout(x,700*(i+1)))}}if(name==='public-config'&&(!opt.method||opt.method==='GET')){try{const cached=localStorage.getItem('nd_public_cache');if(cached)return JSON.parse(cached)}catch{}}throw lastErr||new Error('ارتباط با سرور برقرار نشد')}

ر</label><input type="time" name="opening_time" value="${String(d.studio.opening_time||'10:00').slice(0,5)}"></div><div class="field"><label>پایان کار</label><input type="time" name="closing_time" value="${String(d.studio.closing_time||'18:00').slice(0,5)}"></div><div class="field"><label>فاصله شروع ساعت‌های آزاد</label><input type="number" min="5" max="480" step="5" name="slot_interval_minutes" list="slotPresets" value="${d.studio.slot_interval_minutes||30}"><datalist id="slotPresets"><option value="15"><option value="30"><option value="45"><option value="60"><option value="90"><option value="120"><option value="180"><option value="240"></datalist><small class="jalaliHint">مثال: ۳۰ = شروع‌های ۱۰:۰۰، ۱۰:۳۰، ۱۱:۰۰… / ۱۲۰ = ۱۰:۰۰، ۱۲:۰۰، ۱۴:۰۰…</small></div><div class="field"><label>رزرو آنلاین</label><select name="booking_enabled"><option value="true" ${d.studio.booking_enabled?'selected':''}>فعال</option><option value="false" ${!d.studio.booking_enabled?'selected':''}>غیرفعال</option></select></div></div><button class="btn">ذخیره تنظیمات</button></form></div><div class="card"><h3 style="margin-top:0">بکاپ و نگهداری</h3><p style="font-size:11px;color:var(--muted);line-height:2">برای اطمینان بیشتر می‌توانی هر زمان یک نسخه از اطلاعات عملیاتی را روی گوشی یا لپ‌تاپ ذخیره کنی. این کار هیچ دیتایی را حذف نمی‌کند.</p><button class="btn light" id="backupBtn">دانلود بکاپ JSON</button><div class="noticeBox" style="margin-top:14px">تاریخ‌ها در رابط کاربری شمسی هستند؛ ذخیره‌سازی داخلی استاندارد باقی مانده تا اطلاعات قبلی و گزارش‌ها آسیب نبینند.</div></div></div>`;document.getElementById('backupBtn').onclick=downloadBackup;document.getElementById('settingsForm').onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries());o.booking_enabled=o.booking_enabled==='true';o.slot_interval_minutes=Number(o.slot_interval_minutes);await api('settings-save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});toast('تنظیمات ذخیره شد ✅');state.pub=await api('public-config');await loadAdmin()}}else{title.textContent='نمونه‌کارها';p.innerHTML=`<div style="margin-bottom:12px"><button class="btn" id="newWork">+ نمونه‌کار</button></div><div class="gallery">${d.portfolio.map(w=>`<div class="work">${w.image_url?`<img src="${esc(w.image_url)}">`:'<div class="placeholder"></div>'}<div class="info"><b>${esc(w.title)}</b><div style="font-size:10px;color:var(--muted)">${esc(w.code)} · ${esc(w.category)}</div><button class="btn danger" style="margin-top:8px" data-dw="${w.id}">حذف</button></div></div>`).join('')||'<div class="card">هنوز نمونه‌کاری ثبت نشده.</div>'}</div>`;document.getElementById('newWork').onclick=workForm;document.querySelectorAll('[data-dw]').forEach(b=>b.onclick=()=>del('portfolio',b.dataset.dw))}}
function appointmentTable(list,edit=false){return `<div class="table">${list.map(a=>`<div class="tr"><span>${esc(a.start_time.slice(0,5))}</span><div><b>${esc(a.client_name_snapshot)}</b><div style="font-size:10px;color:var(--muted)">${esc(a.service_name_snapshot)} · بیعانه ${money(a.deposit_amount||0)} · مانده ${money(Math.max(0,Number(a.total_amount||0)-Number(a.deposit_amount||0)))}</div></div><span>${faDate(a.appointment_date)}</span><span>${money(a.total_amount)}</span>${edit?`<div class="actionGroup"><select data-st="${a.id}">${Object.keys(labels).map(k=>`<option value="${k}" ${a.status===k?'selected':''}>${labels[k]}</option>`).join('')}</select><button class="btn waBtn" data-wa="${a.id}" title="یادآوری واتساپ">واتساپ</button></div>`:`<span class="badge ${a.status}">${labels[a.status]||a.status}</span>`}</div>`).join('')||'<div class="card">موردی ثبت نشده.</div>'}</div>`}

function appointmentForm(){if(!state.data.clients.length)return clientForm();showModal('نوبت جدید',`<form id="f"><div class="field"><label>مشتری</label><select name="client_id">${state.data.clients.map(c=>`<option value="${c.id}">${esc(c.full_name)}</option>`).join('')}</select></div><div class="field"><label>خدمت</label><select name="service_id" id="adminService">${state.data.services.filter(s=>s.active).map(s=>`<option value="${s.id}" data-duration="${s.duration_minutes}">${esc(s.name)} · ${s.duration_minutes} دقیقه</option>`).join('')}</select></div><div class="field"><label>مدت این نوبت (دقیقه)</label><input type="number" name="duration_minutes" id="adminDuration" min="15" max="480" step="5"><small class="jalaliHint">برای همین نوبت قابل تغییر است؛ مثلاً ۳۰، ۶۰ یا ۱۲۰ دقیقه.</small></div><div class="grid2"><div class="field"><label>تاریخ شمسی</label>${jalaliPicker('appointment_date','appointmentDate','','future')}</div><div class="field"><label>ساعت</label><select name="start_time" id="atime" required><option value="">اول تاریخ و خدمت را انتخاب کن</option></select></div></div><div class="field"><label>مبلغ</label><input type="number" name="total_amount"></div><button class="btn">ذخیره</button></form>`);const ff=document.getElementById('f'),ad=document.getElementById('appointmentDate_value'),as=document.getElementById('adminService'),dur=document.getElementById('adminDuration'),at=document.getElementById('atime');const syncDur=()=>{const opt=as.selectedOptions[0];if(opt&&!dur.dataset.touched)dur.value=opt.dataset.duration||60};dur.oninput=()=>dur.dataset.touched='1';const fill=async()=>{syncDur();if(!ad.value||!as.value||!dur.value)return;at.innerHTML='<option value="">در حال بررسی ساعت‌های آزاد...</option>';const r=await api('availability&date='+encodeURIComponent(ad.value)+'&service_id='+encodeURIComponent(as.value)+'&duration_minutes='+encodeURIComponent(dur.value));at.innerHTML='<option value="">انتخاب ساعت آزاد</option>'+r.slots.map(t=>'<option value="'+t+'">'+t+'</option>').join('');if(!r.slots.length)at.innerHTML='<option value="">برای این مدت، ساعت خالی وجود ندارد</option>'};bindJalaliPicker('appointmentDate',fill);as.onchange=()=>{dur.dataset.touched='';fill()};dur.onchange=fill;syncDur();document.getElementById('f').onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries());o.client_id=Number(o.client_id);o.service_id=Number(o.service_id);o.duration_minutes=Number(o.duration_minutes||60);if(o.total_amount)o.total_amount=Number(o.total_amount);await api('appointment-save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});modal.innerHTML='';await loadAdmin()}}
function txForm(){showModal('ثبت مالی / بیعانه',`<form id="f"><div class="settingsGrid"><div class="field"><label>نوع</label><select name="kind" id="txKind"><option value="income">درآمد</option><option value="expense">هزینه</option><option value="deposit">بیعانه</option></select></div><div class="field"><label>مبلغ (تومان)</label><input type="number" name="amount" min="1" required></div></div><div class="field"><label>مشتری (برای رسید واتساپ)</label><select name="client_id" id="txClient"><option value="">بدون مشتری</option>${state.data.clients.map(c=>`<option value="${c.id}">${esc(c.full_name)} — ${esc(c.phone)}</option>`).join('')}</select></div><div class="field"><label>اتصال به نوبت</label><select name="appointment_id" id="txAppointment"><option value="">بدون نوبت</option>${state.data.appointments.filter(a=>!['cancelled','no_show'].includes(a.status)).map(a=>`<option value="${a.id}" data-client="${a.client_id||''}">${esc(a.client_name_snapshot)} · ${esc(a.service_name_snapshot)} · ${faDate(a.appointment_date)} ${a.start_time.slice(0,5)}</option>`).join('')}</select></div><div class="field"><label>عنوان</label><input name="title" id="txTitle" value="دریافت وجه" required></div><div class="field"><label>توضیح</label><textarea name="note"></textarea></div><div class="noticeBox">اگر نوع را «بیعانه» و مشتری را انتخاب کنی، بعد از ثبت دکمه ارسال رسید مستقیم به واتساپ نمایش داده می‌شود.</div><button class="btn">ثبت</button></form>`);const form=document.getElementById('f'),kind=document.getElementById('txKind'),clientSel=document.getElementById('txClient'),apSel=document.getElementById('txAppointment'),titleEl=document.getElementById('txTitle');kind.onchange=()=>{if(kind.value==='deposit'&&(titleEl.value==='دریافت وجه'||!titleEl.value))titleEl.value='بیعانه نوبت';else if(kind.value==='expense'&&titleEl.value==='دریافت وجه')titleEl.value='هزینه'};apSel.onchange=()=>{const opt=apSel.selectedOptions[0];if(opt?.dataset.client)clientSel.value=opt.dataset.client};form.onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries());o.amount=Number(o.amount);if(o.client_id)o.client_id=Number(o.client_id);else delete o.client_id;if(o.appointment_id)o.appointment_id=Number(o.appointment_id);else delete o.appointment_id;const cl=state.data.clients.find(c=>Number(c.id)===Number(o.client_id));const r=await api('transaction-save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});modal.innerHTML='';await loadAdmin();if(o.kind==='deposit'&&cl&&r.transaction)showDepositReceipt(r.transaction,cl);else toast('تراکنش ثبت شد ✅')}}
function serviceForm(s={}){showModal(s.id?'ویرایش خدمت':'خدمت جدید',`<form id="f"><input type="hidden" name="id" value="${s.id||''}"><div class="field"><label>نام خدمت</label><input name="name" value="${esc(s.name||'')}" required></div><div class="grid2"><div class="field"><label>قیمت (تومان)</label><input type="number" name="price" min="0" value="${s.price??0}" required></div><div class="field"><label>مدت زمان خدمت (دقیقه)</label><input type="number" name="duration_minutes" min="15" max="480" step="5" list="durationPresets" value="${s.duration_minutes??60}" required><datalist id="durationPresets"><option value="30"><option value="45"><option value="60"><option value="90"><option value="120"><option value="180"><option value="240"></datalist><small class="jalaliHint">مثلاً ۳۰ دقیقه، ۱ ساعت یا ۲ ساعت؛ مقدار دلخواه هم می‌توانی بنویسی.</small></div><div class="field"><label>بیعانه (تومان)</label><input type="number" name="deposit_amount" min="0" value="${s.deposit_amount??0}"></div><div class="field"><label>وضعیت</label><select name="active"><option value="true" ${s.active!==false?'selected':''}>فعال</option><option value="false" ${s.active===false?'selected':''}>غیرفعال</option></select></div></div><button class="btn">ذخیره تغییرات</button></form>`);document.getElementById('f').onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries());if(o.id)o.id=Number(o.id);else delete o.id;o.price=Number(o.price);o.duration_minutes=Number(o.duration_minutes);o.deposit_amount=Number(o.deposit_amount||0);o.active=o.active==='true';await api('service-save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});modal.innerHTML='';toast('خدمت ذخیره شد ✅');await loadAdmin()}}
function workForm(){showModal('نمونه‌کار جدید',`<form id="f"><div class="grid2"><div class="field"><label>کد</label><input name="code" required></div><div class="field"><label>دسته</label><input name="category" required></div></div><div class="field"><label>عنوان</label><input name="title" required></div><div class="field"><label>قیمت پایه</label><input type="number" name="price_from"></div><div class="field"><label>عکس</label><input type="file" name="image" accept="image/*"></div><button class="btn">ذخیره</button></form>`);document.getElementById('f').onsubmit=async e=>{e.preventDefault();await api('portfolio-save',{method:'POST',body:new FormData(e.target)});modal.innerHTML='';await loadAdmin()}}
async function del(entity,id){if(!confirm('حذف شود؟'))return;await api('delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entity,id:Number(id)})});await loadAdmin()}
