<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#3d2631" />
<title>NailDesk | Sargol Nail Studio</title>
<style>
:root{--bg:#f8f3f0;--card:#fffdfa;--ink:#31232a;--muted:#8c7d83;--line:#eaded9;--plum:#6f4152;--rose:#d8a7ad;--soft:#f3e5e7;--ok:#2f7d57;--bad:#b94955;--shadow:0 18px 48px rgba(70,42,54,.09)}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at 90% 0,#efd6d9 0,transparent 28rem),var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.hidden{display:none!important}a{text-decoration:none;color:inherit}.wrap{max-width:1180px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0}.brand{display:flex;gap:10px;align-items:center}.logo{width:46px;height:46px;border-radius:16px;background:linear-gradient(145deg,#e5bdc1,#c58c98);display:grid;place-items:center;font-size:21px}.brand b{display:block}.brand small{font-size:9px;color:var(--muted);letter-spacing:1px}.btn{border:0;border-radius:13px;padding:11px 16px;background:var(--plum);color:#fff;font-weight:700;cursor:pointer}.btn.light{background:var(--soft);color:var(--plum)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--plum)}.btn.danger{background:#fff0f1;color:var(--bad)}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:center;padding:42px 0}.hero h1{font-size:48px;line-height:1.35;margin:0 0 16px}.hero p{line-height:2;color:var(--muted)}.heroCard{background:linear-gradient(145deg,#3d2631,#6a3e50);min-height:330px;border-radius:32px;box-shadow:var(--shadow);position:relative;overflow:hidden}.heroCard:before,.heroCard:after{content:"";position:absolute;border-radius:50%;background:#ffffff12}.heroCard:before{width:240px;height:240px;left:-50px;top:-60px}.heroCard:after{width:170px;height:170px;right:-20px;bottom:-30px}.heroCard .inside{position:absolute;inset:0;padding:34px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.chip{padding:8px 11px;background:#ffffff12;border:1px solid #ffffff22;border-radius:999px;font-size:11px}.section{margin:22px 0 40px}.section h2{font-size:24px}.services{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 10px 25px rgba(70,42,54,.04)}.service b{font-size:15px}.service p{font-size:11px;color:var(--muted)}.price{font-size:18px;font-weight:800;margin-top:12px}.deposit{font-size:10px;color:var(--muted)}.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:11px;font-weight:700}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px;outline:none}.field textarea{min-height:80px}.slots{display:flex;gap:8px;flex-wrap:wrap}.slot{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer}.slot.on{background:var(--plum);color:#fff}.ok,.err{padding:11px 13px;border-radius:12px;font-size:12px;margin-bottom:12px}.ok{background:#edf8f2;color:var(--ok)}.err{background:#fff0f1;color:var(--bad)}.adminShell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:linear-gradient(165deg,#2c1c22,#472b35);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh}.nav{display:flex;flex-direction:column;gap:6px;margin-top:24px}.nav button{background:transparent;color:#ffffffb9;border:0;padding:11px;text-align:right;border-radius:12px;cursor:pointer}.nav button.on{background:#ffffff12;color:#fff}.main{padding:24px;min-width:0}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.stat span{font-size:10px;color:var(--muted)}.stat b{display:block;font-size:19px;margin-top:6px}.table{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.tr{display:grid;grid-template-columns:90px 1.3fr 1fr 110px 110px;gap:8px;padding:12px;border-top:1px solid #f0e8e4;align-items:center}.tr:first-child{border-top:0}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:9px}.pending{background:#fff4dc;color:#8a641d}.confirmed{background:#e9f6ef;color:#347552}.completed{background:#eaf0ff;color:#456ba5}.cancelled,.no_show{background:#fff0f1;color:#a9414d}.modalWrap{position:fixed;inset:0;background:#20131988;display:grid;place-items:center;padding:16px;z-index:100}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:22px;padding:20px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.work{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}.work img,.placeholder{width:100%;aspect-ratio:1;object-fit:cover;background:linear-gradient(145deg,#ead9d4,#cda1aa)}.work .info{padding:12px}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authBox{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:26px;padding:24px;box-shadow:var(--shadow)}.bottom{display:none}.toast{position:fixed;left:20px;bottom:20px;background:#2f2328;color:#fff;padding:10px 14px;border-radius:12px;z-index:300}
@media(max-width:850px){.hero{grid-template-columns:1fr}.hero h1{font-size:34px}.services{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.adminShell{display:block}.side{display:none}.main{padding:14px 12px 84px}.stats{grid-template-columns:1fr 1fr}.tr{grid-template-columns:60px 1fr 85px}.tr>*:nth-child(3),.tr>*:nth-child(4){display:none}.gallery{grid-template-columns:1fr 1fr}.bottom{display:grid;position:fixed;bottom:0;left:0;right:0;height:68px;background:#fff;border-top:1px solid var(--line);grid-template-columns:repeat(5,1fr);z-index:50}.bottom button{border:0;background:#fff;font-size:9px;color:var(--muted)}.bottom button.on{color:var(--plum);background:#f8ecee}}
</style>
</head>
<body>
<div id="app"></div><div id="modal"></div>
<script>
const API='https://dqvoxpwzjeetxhssryti.supabase.co/functions/v1/naildesk';
const app=document.getElementById('app'),modal=document.getElementById('modal');
let state={pub:null,data:null,route:'dashboard'};
const labels={pending:'در انتظار',confirmed:'تأیید شده',completed:'انجام شد',cancelled:'لغو شد',no_show:'عدم مراجعه'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money=v=>Number(v||0).toLocaleString('fa-IR')+' تومان';
const faDate=v=>v?new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'short',day:'numeric'}).format(new Date(v.length===10?v+'T12:00:00':v)):'—';
const token=()=>localStorage.getItem('nd_token')||'';
async function api(name,opt={}){const h=new Headers(opt.headers||{});if(token())h.set('Authorization','Bearer '+token());const r=await fetch(API+'?api='+name,{...opt,headers:h});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||'خطا');return j}
function brand(){return `<div class="brand"><div class="logo">✦</div><div><b>NailDesk</b><small>SARGOL NAIL STUDIO</small></div></div>`}
function toast(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
async function boot(){try{state.pub=await api('public-config')}catch(e){app.innerHTML='<div class="auth"><div class="err">'+esc(e.message)+'</div></div>';return}route()}
window.addEventListener('hashchange',route);
function route(){const h=location.hash.slice(1);if(h==='admin')return adminEntry();if(h==='demo')return demo();publicHome()}
function publicHome(){const p=state.pub;app.innerHTML=`<div class="wrap"><div class="top">${brand()}<div><a class="btn ghost" href="#admin">ورود مدیریت</a></div></div><section class="hero"><div><h1>نوبت ناخن، مرتب و بدون تماس اضافه.</h1><p>خدمتت را انتخاب کن، ساعت‌های واقعاً آزاد را ببین و درخواست نوبت بفرست. درخواست بعد از تأیید مدیریت قطعی می‌شود.</p><div class="chips"><span class="chip" style="background:#f1e1e4;color:#5c3342">رزرو واقعی</span><span class="chip" style="background:#f1e1e4;color:#5c3342">بدون هزینه اشتراک</span></div></div><div class="heroCard"><div class="inside"><small>SARGOL NAIL STUDIO</small><h2>زیبایی در جزئیات است.</h2><p style="color:#ffffffaa">اقلیـد · شنبه تا پنجشنبه · ۱۰ تا ۱۸</p></div></div></section><section class="section"><h2>خدمات</h2><div class="services">${p.services.map(s=>`<div class="card service"><b>${esc(s.name)}</b><p>${s.duration_minutes} دقیقه</p><div class="price">${money(s.price)}</div><div class="deposit">بیعانه: ${money(s.deposit_amount)}</div></div>`).join('')}</div></section><section class="section"><h2>رزرو نوبت</h2><div class="panel"><div id="msg"></div><form id="bookForm"><div class="grid2"><div class="field"><label>خدمت</label><select name="service_id" id="service" required><option value="">انتخاب خدمت</option>${p.services.map(s=>`<option value="${s.id}">${esc(s.name)} — ${money(s.price)}</option>`).join('')}</select></div><div class="field"><label>تاریخ</label><input type="date" name="date" id="date" required></div></div><div class="field"><label>ساعت آزاد</label><div id="slots" class="slots"><span style="font-size:11px;color:var(--muted)">خدمت و تاریخ را انتخاب کن.</span></div><input type="hidden" name="time" id="time"></div><div class="grid2"><div class="field"><label>نام و نام خانوادگی</label><input name="full_name" required></div><div class="field"><label>شماره موبایل</label><input name="phone" required></div></div><div class="field"><label>یادداشت</label><textarea name="notes" placeholder="مثلاً رنگ یا طرح مدنظر"></textarea></div><button class="btn" style="width:100%">ارسال درخواست نوبت</button></form></div></section><div class="section" style="text-align:center;color:var(--muted);font-size:11px">NailDesk · سیستم دیجیتال Sargol Nail Studio</div></div>`;const d=document.getElementById('date');d.min=new Date().toISOString().slice(0,10);document.getElementById('service').onchange=loadSlots;d.onchange=loadSlots;document.getElementById('bookForm').onsubmit=submitBook}
async function loadSlots(){const s=document.getElementById('service').value,d=document.getElementById('date').value,b=document.getElementById('slots');if(!s||!d)return;b.innerHTML='در حال بررسی...';try{const r=await api('availability&date='+encodeURIComponent(d)+'&service_id='+encodeURIComponent(s));b.innerHTML=r.slots.length?r.slots.map(t=>`<button type="button" class="slot" data-t="${t}">${t}</button>`).join(''):'<span style="font-size:11px;color:var(--muted)">ساعت خالی برای این روز وجود ندارد.</span>';b.querySelectorAll('.slot').forEach(x=>x.onclick=()=>{b.querySelectorAll('.slot').forEach(y=>y.classList.remove('on'));x.classList.add('on');document.getElementById('time').value=x.dataset.t})}catch(e){b.innerHTML='<span class="err">'+esc(e.message)+'</span>'}}
async function submitBook(ev){ev.preventDefault();const f=new FormData(ev.target),o=Object.fromEntries(f.entries());if(!o.time)return toast('ساعت را انتخاب کن');o.service_id=Number(o.service_id);try{await api('book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});document.getElementById('msg').innerHTML='<div class="ok">درخواست ثبت شد. بعد از تأیید مدیریت نوبت قطعی می‌شود.</div>';ev.target.reset();document.getElementById('slots').innerHTML=''}catch(e){document.getElementById('msg').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}
async function adminEntry(){try{const s=await api('session');if(s.authenticated)return loadAdmin();renderAuth(s.setup_completed)}catch{renderAuth(false)}}
function renderAuth(setup){app.innerHTML=`<div class="auth"><div class="authBox">${brand()}<h2>${setup?'ورود مدیریت':'راه‌اندازی اولیه'}</h2><p style="font-size:11px;color:var(--muted)">${setup?'با حساب مدیریت وارد شوید.':'این مرحله فقط یک بار برای ساخت حساب سارا انجام می‌شود.'}</p><div id="authMsg"></div><form id="authForm">${setup?`<div class="field"><label>ایمیل</label><input type="email" name="email" required></div><div class="field"><label>رمز عبور</label><input type="password" name="password" required></div>`:`<div class="field"><label>کد فعال‌سازی</label><input name="setup_code" required></div><div class="field"><label>نام مدیر</label><input name="display_name" value="سارا قربانی" required></div><div class="field"><label>ایمیل</label><input type="email" name="email" required></div><div class="field"><label>رمز عبور</label><input type="password" name="password" minlength="8" required></div>`}<button class="btn" style="width:100%">${setup?'ورود':'فعال‌سازی'}</button></form><div style="margin-top:12px"><a href="#" style="font-size:11px;color:var(--plum)">بازگشت به رزرو</a></div></div></div>`;document.getElementById('authForm').onsubmit=async ev=>{ev.preventDefault();const o=Object.fromEntries(new FormData(ev.target).entries());try{const r=await api(setup?'login':'setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});if(r.token)localStorage.setItem('nd_token',r.token);await loadAdmin()}catch(e){document.getElementById('authMsg').innerHTML='<div class="err">'+esc(e.message)+'</div>'}}}
async function loadAdmin(){try{state.data=await api('dashboard');renderAdmin()}catch(e){localStorage.removeItem('nd_token');renderAuth(true)}}
function navBtn(r,t){return `<button data-r="${r}" class="${state.route===r?'on':''}">${t}</button>`}
function renderAdmin(){const d=state.data;app.innerHTML=`<div class="adminShell"><aside class="side">${brand()}<div class="nav">${navBtn('dashboard','داشبورد')}${navBtn('appointments','نوبت‌ها')}${navBtn('clients','مشتری‌ها')}${navBtn('finance','مالی')}${navBtn('portfolio','نمونه‌کار')}</div><button id="logout" class="btn ghost" style="position:absolute;bottom:20px;right:16px;color:#fff;border-color:#ffffff33">خروج</button></aside><main class="main"><div class="head"><div><h1 id="pt" style="margin:0;font-size:24px"></h1><p style="margin:4px 0;color:var(--muted);font-size:11px">${esc(d.studio.studio_name)}</p></div><a href="#" class="btn ghost">صفحه رزرو</a></div><div id="page"></div></main><nav class="bottom">${navBtn('dashboard','خانه')}${navBtn('appointments','نوبت')}${navBtn('clients','مشتری')}${navBtn('finance','مالی')}${navBtn('portfolio','گالری')}</nav></div>`;document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{state.route=b.dataset.r;renderAdmin()});document.getElementById('logout').onclick=async()=>{await api('logout',{method:'POST'}).catch(()=>{});localStorage.removeItem('nd_token');location.hash='';};renderPage()}
function renderPage(){const p=document.getElementById('page'),d=state.data,title=document.getElementById('pt');if(state.route==='dashboard'){title.textContent='داشبورد';p.innerHTML=`<div class="stats"><div class="stat"><span>درآمد امروز</span><b>${money(d.summary.todayIncome)}</b></div><div class="stat"><span>نوبت امروز</span><b>${d.summary.todayAppointments}</b></div><div class="stat"><span>مشتری‌ها</span><b>${d.summary.totalClients}</b></div><div class="stat"><span>سود ۳۰ روز</span><b>${money(d.summary.recentNet)}</b></div></div><h3>آخرین نوبت‌ها</h3>${appointmentTable(d.appointments.slice(0,8))}`}else if(state.route==='appointments'){title.textContent='نوبت‌ها';p.innerHTML=`<div style="margin-bottom:12px"><button class="btn" id="newAp">+ نوبت جدید</button></div>${appointmentTable(d.appointments,true)}`;document.getElementById('newAp').onclick=()=>appointmentForm();bindStatus()}else if(state.route==='clients'){title.textContent='مشتری‌ها';p.innerHTML=`<div style="margin-bottom:12px"><button class="btn" id="newCl">+ مشتری جدید</button></div><div class="table">${d.clients.map(c=>`<div class="tr"><span></span><div><b>${esc(c.full_name)}</b><div style="font-size:10px;color:var(--muted)">${esc(c.phone)}</div></div><span>${c.total_visits||0} مراجعه</span><span>${money(c.total_spent)}</span><button class="btn danger" data-dc="${c.id}">حذف</button></div>`).join('')||'<div class="card">مشتری ثبت نشده.</div>'}</div>`;document.getElementById('newCl').onclick=clientForm;document.querySelectorAll('[data-dc]').forEach(b=>b.onclick=()=>del('client',b.dataset.dc))}else if(state.route==='finance'){title.textContent='مالی';p.innerHTML=`<div class="stats"><div class="stat"><span>درآمد ۳۰ روز</span><b>${money(d.summary.recentIncome)}</b></div><div class="stat"><span>هزینه ۳۰ روز</span><b>${money(d.summary.recentExpense)}</b></div><div class="stat"><span>سود خالص</span><b>${money(d.summary.recentNet)}</b></div><div class="stat"><span>امروز</span><b>${money(d.summary.todayIncome)}</b></div></div><div style="margin:14px 0"><button class="btn" id="newTx">+ ثبت مالی</button></div><div class="table">${d.transactions.map(t=>`<div class="tr"><span></span><div><b>${esc(t.title)}</b></div><span>${money(t.amount)}</span><span>${esc(t.kind)}</span><button class="btn danger" data-dt="${t.id}">حذف</button></div>`).join('')}</div>`;document.getElementById('newTx').onclick=txForm;document.querySelectorAll('[data-dt]').forEach(b=>b.onclick=()=>del('transaction',b.dataset.dt))}else{title.textContent='نمونه‌کارها';p.innerHTML=`<div style="margin-bottom:12px"><button class="btn" id="newWork">+ نمونه‌کار</button></div><div class="gallery">${d.portfolio.map(w=>`<div class="work">${w.image_url?`<img src="${esc(w.image_url)}">`:'<div class="placeholder"></div>'}<div class="info"><b>${esc(w.title)}</b><div style="font-size:10px;color:var(--muted)">${esc(w.code)} · ${esc(w.category)}</div><button class="btn danger" style="margin-top:8px" data-dw="${w.id}">حذف</button></div></div>`).join('')||'<div class="card">هنوز نمونه‌کاری ثبت نشده.</div>'}</div>`;document.getElementById('newWork').onclick=workForm;document.querySelectorAll('[data-dw]').forEach(b=>b.onclick=()=>del('portfolio',b.dataset.dw))}}
function appointmentTable(list,edit=false){return `<div class="table">${list.map(a=>`<div class="tr"><span>${esc(a.start_time.slice(0,5))}</span><div><b>${esc(a.client_name_snapshot)}</b><div style="font-size:10px;color:var(--muted)">${esc(a.service_name_snapshot)}</div></div><span>${faDate(a.appointment_date)}</span><span>${money(a.total_amount)}</span>${edit?`<select data-st="${a.id}">${Object.keys(labels).map(k=>`<option value="${k}" ${a.status===k?'selected':''}>${labels[k]}</option>`).join('')}</select>`:`<span class="badge ${a.status}">${labels[a.status]||a.status}</span>`}</div>`).join('')||'<div class="card">موردی ثبت نشده.</div>'}</div>`}
function bindStatus(){document.querySelectorAll('[data-st]').forEach(s=>s.onchange=async()=>{await api('appointment-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:Number(s.dataset.st),status:s.value})});await loadAdmin()})}
function showModal(title,body){modal.innerHTML=`<div class="modalWrap"><div class="modal"><div style="display:flex;justify-content:space-between"><h3>${title}</h3><button class="btn ghost" id="closeM">×</button></div>${body}</div></div>`;document.getElementById('closeM').onclick=()=>modal.innerHTML=''}
function clientForm(){showModal('مشتری جدید',`<form id="f"><div class="field"><label>نام</label><input name="full_name" required></div><div class="field"><label>موبایل</label><input name="phone" required></div><div class="field"><label>سبک موردعلاقه</label><input name="favorite_style"></div><div class="field"><label>یادداشت</label><textarea name="notes"></textarea></div><button class="btn">ذخیره</button></form>`);document.getElementById('f').onsubmit=async e=>{e.preventDefault();await api('client-save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target).entries()))});modal.innerHTML='';await loadAdmin()}}
function appointmentForm(){if(!state.data.clients.length)return clientForm();showModal('نوبت جدید',`<form id="f"><div class="field"><label>مشتری</label><select name="client_id">${state.data.clients.map(c=>`<option value="${c.id}">${esc(c.full_name)}</option>`).join('')}</select></div><div class="field"><label>خدمت</label><select name="service_id">${state.data.services.filter(s=>s.active).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="grid2"><div class="field"><label>تاریخ</label><input type="date" name="appointment_date" required></div><div class="field"><label>ساعت</label><input type="time" name="start_time" required></div></div><div class="field"><label>مبلغ</label><input type="number" name="total_amount"></div><button class="btn">ذخیره</button></form>`);document.getElementById('f').onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries());o.client_id=Number(o.client_id);o.service_id=Number(o.service_id);if(o.total_amount)o.total_amount=Number(o.total_amount);await api('appointment-save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});modal.innerHTML='';await loadAdmin()}}
function txForm(){showModal('ثبت مالی',`<form id="f"><div class="field"><label>نوع</label><select name="kind"><option value="income">درآمد</option><option value="expense">هزینه</option><option value="deposit">بیعانه</option></select></div><div class="field"><label>مبلغ</label><input type="number" name="amount" required></div><div class="field"><label>عنوان</label><input name="title" required></div><div class="field"><label>توضیح</label><textarea name="note"></textarea></div><button class="btn">ثبت</button></form>`);document.getElementById('f').onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries());o.amount=Number(o.amount);await api('transaction-save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});modal.innerHTML='';await loadAdmin()}}
function workForm(){showModal('نمونه‌کار جدید',`<form id="f"><div class="grid2"><div class="field"><label>کد</label><input name="code" required></div><div class="field"><label>دسته</label><input name="category" required></div></div><div class="field"><label>عنوان</label><input name="title" required></div><div class="field"><label>قیمت پایه</label><input type="number" name="price_from"></div><div class="field"><label>عکس</label><input type="file" name="image" accept="image/*"></div><button class="btn">ذخیره</button></form>`);document.getElementById('f').onsubmit=async e=>{e.preventDefault();await api('portfolio-save',{method:'POST',body:new FormData(e.target)});modal.innerHTML='';await loadAdmin()}}
async function del(entity,id){if(!confirm('حذف شود؟'))return;await api('delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entity,id:Number(id)})});await loadAdmin()}
function demo(){app.innerHTML=`<div class="wrap"><div class="top">${brand()}<a href="#" class="btn ghost">بازگشت</a></div><h1>نسخه نمایشی NailDesk</h1><div class="stats"><div class="stat"><span>درآمد امروز</span><b>۲,۶۸۰,۰۰۰ تومان</b></div><div class="stat"><span>نوبت امروز</span><b>۳</b></div><div class="stat"><span>مشتری فعال</span><b>۸۶</b></div><div class="stat"><span>سود ماه</span><b>۳۵.۹ میلیون</b></div></div></div>`}
boot();
</script>
</body></html>
